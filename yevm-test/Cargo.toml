[package]
name = "yevm-test"
version = "0.1.0"
edition = "2024"
description = "Internal test harness and revm cross-validation for YEVM."
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/sergey-melnychuk/yevm"
publish = false

[dependencies]
eyre.workspace = true
async-trait.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
yevm-base.workspace = true
yevm-core.workspace = true
yevm-misc.workspace = true
yevm-reth = { path = "../yevm-reth", optional = true }

revm = { version = "43.0", features = ["alloydb"] }
alloy-eip7702 = { version = "0.6.3", features = ["k256"] }
alloy-primitives = { version = "1.5", default-features = false, features = ["rlp"] }
alloy-provider = { version = "2.5", default-features = true }
tokio = { version = "1.50", features = ["full"] }
futures = "0.3"
dotenv = "0.15"

[features]
# Off by default: pulls in reth's full dependency tree (see yevm-reth).
# Enables `replay --with-reth <datadir>` to read state directly from a
# local reth MDBX datadir instead of RPC.
reth = ["dep:yevm-reth"]

[dev-dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }
pretty_assertions = "1.4"
