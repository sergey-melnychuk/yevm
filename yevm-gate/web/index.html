<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yevm · gate</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b0e1a; color: #e2e8f0; font-family: monospace; font-size: 14px; padding: 24px; }
  .header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  h1 { color: #7dd3fc; font-size: 1.1em; letter-spacing: 0.05em; white-space: nowrap; }
  .session-wrap { position: relative; }
  #session { width: 21ch; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wallet-menu { display: none; position: absolute; top: calc(100% + 6px); right: 0; min-width: 21ch;
                 background: #10162a; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px;
                 overflow: hidden; z-index: 10; }
  .wallet-menu.open { display: block; }
  .wallet-menu button { display: block; width: 100%; text-align: left; padding: 8px 12px; background: none;
                         border: none; color: #e2e8f0; font-family: monospace; font-size: 0.85em; cursor: pointer; }
  .wallet-menu button:hover { background: rgba(56,189,248,0.12); }
  #list { display: flex; flex-direction: column; gap: 12px; }
  .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 14px 16px; }
  .hash-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .hash { color: #94a3b8; font-size: 0.85em; margin-bottom: 4px; word-break: break-all; }
  .hash-row .hash { margin-bottom: 0; flex: 1; min-width: 0; }
  .chain-chip { flex: none; font-size: 0.72em; color: #7dd3fc; background: rgba(56,189,248,0.12);
                border: 1px solid rgba(56,189,248,0.3); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
  .from { color: #64748b; font-size: 0.78em; margin-bottom: 8px; }
  .status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; font-weight: 600; margin-bottom: 8px; }
  .status.pending { background: rgba(251,191,36,0.15);  color: #fbbf24; }
  .status.done    { background: rgba(74,222,128,0.15);  color: #4ade80; }
  .status.failed  { background: rgba(248,113,113,0.15); color: #f87171; }
  .meta { color: #64748b; font-size: 0.82em; margin-bottom: 10px; }
  .meta span { margin-right: 16px; }
  .meta .ok  { color: #4ade80; }
  .meta .bad { color: #f87171; }
  .actions { display: flex; gap: 8px; }
  .btn { background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.3); color: #7dd3fc;
         padding: 6px 16px; border-radius: 6px; cursor: pointer; font-family: monospace; font-size: 0.85em; }
  .btn:hover { background: rgba(56,189,248,0.22); }
  .btn.danger { background: rgba(248,113,113,0.10); border-color: rgba(248,113,113,0.3); color: #f87171; }
  .btn.danger:hover { background: rgba(248,113,113,0.20); }
  .empty { color: #475569; font-style: italic; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  #admin-badge { display: none; align-self: stretch; align-items: center; color: #f87171; font-size: 0.72em;
                 font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; padding: 0 10px;
                 border-radius: 6px; white-space: nowrap; border: 1px solid rgba(248,113,113,0.4);
                 background: rgba(248,113,113,0.12); }
  #admin-badge.on { display: inline-flex; }
  #gear { width: auto; padding: 6px 10px; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100;
                   align-items: flex-start; justify-content: center; padding: 60px 16px; overflow-y: auto; }
  .modal-overlay.open { display: flex; }
  .modal { background: #10162a; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
           width: 100%; max-width: 800px; padding: 20px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .modal-head h2 { color: #7dd3fc; font-size: 1em; letter-spacing: 0.04em; }
  .modal-close { background: none; border: none; color: #94a3b8; font-size: 1.2em; cursor: pointer; padding: 0 4px; }
  .modal-note { color: #64748b; font-size: 0.78em; margin-bottom: 14px; }
  .chain-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .chain-id { flex: none; width: 12ch; color: #94a3b8; font-size: 0.82em; }
  .chain-id .cname { color: #7dd3fc; }
  .modal input { flex: 1; min-width: 12ch; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
                 border-radius: 5px; color: #e2e8f0; font-family: monospace; font-size: 0.82em; padding: 5px 8px; }
  .modal input:disabled { opacity: 0.5; }
  .src-badge { flex: none; font-size: 0.68em; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
  .src-badge.global { color: #7dd3fc; background: rgba(56,189,248,0.12); }
  .src-badge.local  { color: #fbbf24; background: rgba(251,191,36,0.12); }
  .chain-err { color: #f87171; font-size: 0.75em; margin: 2px 0 8px 0; }
  .chain-add { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 14px;
               border-top: 1px solid rgba(255,255,255,0.08); flex-wrap: wrap; }
  .btn.sm { padding: 5px 10px; font-size: 0.78em; }
  .sim-block { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; padding-bottom: 14px;
               border-bottom: 1px solid rgba(255,255,255,0.08); flex-wrap: wrap; font-size: 0.82em; color: #94a3b8; }
  #sim-banner { display: none; margin-bottom: 16px; padding: 6px 12px; border-radius: 6px; font-size: 0.82em;
                color: #fbbf24; background: rgba(251,191,36,0.10); border: 1px solid rgba(251,191,36,0.3); }
  #sim-banner.on { display: block; }
  .analysis { display: flex; flex-direction: column; gap: 12px; margin-bottom: 10px; }
  .an-section-title { color: #7dd3fc; font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .an-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 6px 10px; border-radius: 6px; font-size: 0.82em; margin-bottom: 4px; }
  .an-row:last-child { margin-bottom: 0; }
  .an-row.warn    { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.3); }
  .an-row.caution { background: rgba(251,191,36,0.07);  border: 1px solid rgba(251,191,36,0.25); }
  .an-row.neutral { background: rgba(0,0,0,0.2);        border: 1px solid rgba(255,255,255,0.08); }
  .an-label { font-weight: 600; }
  .an-label.red { color: #f87171; }
  .an-label.yel { color: #fbbf24; }
  .an-label.dim { color: #64748b; }
  .an-role { color: #64748b; font-weight: 400; }
  .an-addr { color: #94a3b8; word-break: break-all; }
  .an-val { color: #e2e8f0; }
  .an-val.new { color: #f87171; }
  .an-pos { color: #4ade80; }
  .an-neg { color: #f87171; }
  .an-empty { color: #475569; font-style: italic; font-size: 0.82em; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="header">
  <h1>yevm · gate</h1>
  <div class="header-right">
    <span id="admin-badge">admin</span>
    <button id="gear" class="btn" onclick="openSettings()" title="Chain settings" style="display:none">⚙</button>
    <div class="session-wrap">
      <button id="session" class="btn" onclick="onSessionClick()">Connect Wallet</button>
      <div id="wallet-menu" class="wallet-menu"></div>
    </div>
  </div>
</div>
<div id="sim-banner"></div>
<div id="list"></div>

<div id="settings" class="modal-overlay" onclick="if (event.target === this) closeSettings()">
  <div class="modal">
    <div class="modal-head">
      <h2>Chain configuration</h2>
      <button class="modal-close" onclick="closeSettings()">✕</button>
    </div>
    <div class="sim-block">
      <span>Simulate against block:</span>
      <input id="sim-block-input" placeholder="latest" style="width:14ch;flex:none">
      <button class="btn sm" onclick="applySimBlock()">Apply</button>
    </div>
    <div class="modal-note" id="settings-note"></div>
    <div id="chain-rows"></div>
    <div class="chain-add">
      <input id="add-chain-id" placeholder="chain id (e.g. 8453 or 0x2105)" style="width:16ch;flex:none">
      <input id="add-chain-url" placeholder="https://rpc…">
      <button class="btn sm" onclick="addChain()">Add</button>
    </div>
    <div class="chain-err" id="add-chain-err"></div>
  </div>
</div>
<script>
let token = localStorage.getItem('yevm_gate_token');
let address = localStorage.getItem('yevm_gate_address');
let isAdmin = localStorage.getItem('yevm_gate_admin') === '1';

function authHeaders() {
  return token ? { 'Authorization': 'Bearer ' + token } : {};
}

let wasmReady = false;
let wasmExecute = null;
let wasmAnalyse = null;
async function loadWasm() {
  try {
    const mod = await import('/static/yevm_wasm.js');
    await mod.default();
    wasmExecute = mod.execute;
    wasmAnalyse = mod.analyse;
    wasmReady = true;
  } catch (e) {
    console.error('wasm init failed', e);
  }
  // Simulate any cards that were rendered before the simulator was ready.
  for (const item of currentList) {
    if (!simResults.has(item.hash) && wasmReady) simulateCard(item);
  }
}

async function connect(provider) {
  if (!provider) { alert('No wallet detected.'); return; }

  const accounts = await provider.request({ method: 'eth_requestAccounts' });
  if (!accounts || !accounts.length) {
    alert('Wallet returned no accounts - unlock it and select an account, then try again.');
    return;
  }
  const account = accounts[0];
  const chainId = parseInt(await provider.request({ method: 'eth_chainId' }), 16);

  const { nonce } = await fetch('/auth/challenge').then(r => r.json());

  const now = new Date();
  const exp = new Date(now.getTime() + 60_000);
  const message = [
    `${location.host} wants you to sign in with your Ethereum account:`,
    account,
    '',
    'Sign in to yevm-gate',
    '',
    `URI: ${location.origin}`,
    'Version: 1',
    `Chain ID: ${chainId}`,
    `Nonce: ${nonce}`,
    `Issued At: ${now.toISOString()}`,
    `Expiration Time: ${exp.toISOString()}`,
  ].join('\n');

  const msgHex = '0x' + Array.from(new TextEncoder().encode(message), b => b.toString(16).padStart(2, '0')).join('');
  const signature = await provider.request({ method: 'personal_sign', params: [msgHex, account] });

  const res = await fetch('/auth/verify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, signature }),
  });
  if (!res.ok) { alert('Auth failed: ' + (await res.json()).error); return; }

  const data = await res.json();
  token = data.token;
  address = data.address;
  isAdmin = !!data.admin;
  localStorage.setItem('yevm_gate_token', token);
  localStorage.setItem('yevm_gate_address', address);
  localStorage.setItem('yevm_gate_admin', isAdmin ? '1' : '0');

  updateHeader();
  load();
}

function updateHeader() {
  const btn = document.getElementById('session');
  btn.textContent = address ? _fmtAcc(address, null, true) : 'Connect Wallet';
  // Chain settings require a session (GET /chain is auth-gated), so the gear only
  // shows once connected.
  document.getElementById('gear').style.display = address ? '' : 'none';
  // Red "admin" label when this session may edit the global chain registry.
  document.getElementById('admin-badge').classList.toggle('on', !!(address && isAdmin));
}

// EIP-6963 (Multi Injected Provider Discovery): each installed wallet extension
// announces itself here instead of everyone fighting over window.ethereum. The
// listener must be registered before the request is dispatched, or announcements
// made synchronously in response to it would be missed.
const wallets = []; // { info: { uuid, name, icon, rdns }, provider }
window.addEventListener('eip6963:announceProvider', (event) => {
  const { info, provider } = event.detail;
  if (!wallets.some(w => w.info.uuid === info.uuid)) {
    wallets.push({ info, provider });
    if (!address) closeWalletMenu(); // list changed; close so the next click re-renders it
  }
});
window.dispatchEvent(new Event('eip6963:requestProvider'));

function closeWalletMenu() {
  document.getElementById('wallet-menu').classList.remove('open');
}

function openWalletMenu() {
  const menu = document.getElementById('wallet-menu');
  menu.innerHTML = '';
  wallets.forEach((w, i) => {
    const btn = document.createElement('button');
    btn.textContent = w.info.name;
    btn.onclick = () => selectWallet(i);
    menu.appendChild(btn);
  });
  menu.classList.add('open');
}

function selectWallet(i) {
  closeWalletMenu();
  connect(wallets[i].provider);
}

// Click outside the button/menu closes the menu.
document.addEventListener('click', (e) => {
  if (!e.target.closest('.session-wrap')) closeWalletMenu();
});

function onSessionClick() {
  if (address) {
    closeWalletMenu();
    if (confirm(`Sign out of ${address}?`)) signOut();
    return;
  }
  if (wallets.length >= 2) {
    document.getElementById('wallet-menu').classList.contains('open')
      ? closeWalletMenu()
      : openWalletMenu();
    return;
  }
  // Zero or one EIP-6963 wallet: fall back to the legacy single-provider global.
  const provider = wallets[0]?.provider || window.ethereum;
  if (!provider) { alert('No wallet detected.'); return; }
  connect(provider);
}

function signOut() {
  token = null;
  address = null;
  isAdmin = false;
  localStorage.removeItem('yevm_gate_token');
  localStorage.removeItem('yevm_gate_address');
  localStorage.removeItem('yevm_gate_admin');
  currentList = [];
  simResults.clear();
  updateHeader();
  load();
}

// The chainId -> RPC url map used both to resolve where to simulate a pending
// tx and (once submitted) where to broadcast it. Fetched once and cached; the
// gate is the only party that manages this registry, so it doesn't change
// mid-session under normal use.
// Per-browser chain URL overrides (numeric chainId -> url). Anyone can set these;
// they layer on top of the server's global registry (overrides win) and never
// leave this browser. Admins instead edit the global registry via the API.
function loadOverrides() {
  try { return JSON.parse(localStorage.getItem('yevm_gate_chain_overrides') || '{}'); }
  catch { return {}; }
}
function saveOverride(id, url) {
  const o = loadOverrides();
  o[String(id)] = url;
  localStorage.setItem('yevm_gate_chain_overrides', JSON.stringify(o));
  chainUrls = null; // invalidate the merged cache
}
function removeOverride(id) {
  const o = loadOverrides();
  delete o[String(id)];
  localStorage.setItem('yevm_gate_chain_overrides', JSON.stringify(o));
  chainUrls = null;
}

// The server's global registry (numeric chainId -> url), fetched once.
let globalChains = null;
async function loadGlobalChains(force = false) {
  if (globalChains === null || force) {
    const res = await fetch('/chain', { headers: authHeaders() });
    const raw = res.ok ? await res.json() : {};
    // Keyed by numeric chain id, not the raw hex string: /chain's keys ("0x1")
    // and a decoded tx's chainId ("0x0000000000000001", a zero-padded Hex<8>)
    // are both valid hex for the same chain but spelled differently.
    globalChains = {};
    for (const [hex, url] of Object.entries(raw)) globalChains[parseInt(hex, 16)] = url;
    chainUrls = null;
  }
  return globalChains;
}

// Effective map used for simulation/broadcast: global registry with local
// overrides layered on top.
let chainUrls = null;
async function loadChains() {
  if (!chainUrls) {
    const global = await loadGlobalChains();
    chainUrls = { ...global };
    for (const [id, url] of Object.entries(loadOverrides())) chainUrls[Number(id)] = url;
  }
  return chainUrls;
}

// Block to pin simulation to (null = latest). Stored per-browser. Pinning to a
// historical block (e.g. pre-exploit) requires the chain's RPC to be an archive
// node - set that via a chain override.
function getSimBlock() {
  const v = localStorage.getItem('yevm_gate_sim_block');
  return v && /^\d+$/.test(v) ? Number(v) : null;
}
function setSimBlock(v) {
  if (v == null || v === '') localStorage.removeItem('yevm_gate_sim_block');
  else localStorage.setItem('yevm_gate_sim_block', String(v));
}
// The block tag for JSON-RPC state reads: the pinned block as hex, else 'latest'.
function simBlockTag() {
  const b = getSimBlock();
  return b == null ? 'latest' : '0x' + b.toString(16);
}

// Fetch the sender's current on-chain nonce through the gate's own RPC proxy
// (same-origin, CORS-safe; the gate forwards reads to the chain upstream).
// 'latest' = confirmed nonce = count of mined txs. Returns a BigInt, or null on
// any RPC/parse error so the caller skips the check instead of warning falsely.
async function fetchAccountNonce(cid, from, blockTag = 'latest') {
  try {
    const res = await fetch('/rpc/' + cid, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_getTransactionCount', params: [from, blockTag] }),
    });
    const j = await res.json();
    return j?.result != null ? BigInt(j.result) : null;
  } catch { return null; }
}

// Classify the signed tx's nonce against the sender's on-chain nonce:
//   ok     - equal; this is the next tx to mine.
//   behind - already used; the tx can never be mined ("nonce too low").
//   ahead  - a gap; the tx stays queued until the missing nonces are used -
//            UNLESS this gate is already holding those in-between txs from the
//            same sender (a legit stacked tx), in which case it's 'queued'.
// Returns null (no badge) when the account nonce couldn't be fetched.
async function checkNonce(item, cid) {
  // Check against the same block the simulation runs at, so a pinned-block replay
  // stays consistent (the tx reads 'ok' at its own era, not 'behind' vs head).
  const accountNonce = await fetchAccountNonce(cid, item.from, simBlockTag());
  if (accountNonce == null) return null;
  let txNonce;
  try { txNonce = BigInt(item.tx.nonce); } catch { return null; }
  let status = txNonce === accountNonce ? 'ok' : txNonce < accountNonce ? 'behind' : 'ahead';
  let ahead = 0;
  if (status === 'ahead') {
    // Distinct same-sender pending nonces that fill the gap [account, tx).
    const filling = new Set();
    for (const other of currentList) {
      if (other.hash === item.hash) continue;
      if ((other.from || '').toLowerCase() !== (item.from || '').toLowerCase()) continue;
      let n; try { n = BigInt(other.tx.nonce); } catch { continue; }
      if (n >= accountNonce && n < txNonce) filling.add(n.toString());
    }
    ahead = filling.size;
    if (BigInt(ahead) === txNonce - accountNonce) status = 'queued';
  }
  return { status, txNonce: txNonce.toString(), accountNonce: accountNonce.toString(), ahead };
}

let currentList = [];
// hash -> { status: 'pending'|'done'|'failed', analysis, nonceCheck, error }
const simResults = new Map();

// Run the decoded pending tx (exactly as signed - real nonce/fees/access list)
// against the chain it was captured on. Never touches `raw`: simulation only
// needs the decoded `call`/`tx` the API already returned. The raw event stream
// is fed straight into analyse() - we surface the structured effects it derives
// (ETH/token movements, approvals, proxy swaps), not the individual events.
async function simulateCard(item) {
  const { hash, tx } = item;
  simResults.set(hash, { status: 'pending' });
  render();
  const cid = _chainId(tx.chainId);
  // Nonce sanity runs alongside the simulation - an independent RPC read, so a
  // slow/failing nonce lookup never blocks the analysis (and vice versa).
  const noncePromise = checkNonce(item, cid);
  try {
    const urls = await loadChains();
    const url = urls[cid];
    if (!url) throw new Error(`no RPC configured for chain ${tx.chainId}`);
    const EVENT_FILTER = 0xFFFFFFFF - 1; // exclude STEP events
    const stream = await wasmExecute(url, item.call, tx, EVENT_FILTER, getSimBlock() ?? undefined);
    const traces = [];
    for (;;) {
      const t = await stream.next();
      if (t == null) break;
      if (t.event && t.event.Undo) {
        // mark the reverted span for analyse() to be aware of it.
        const [from, to] = t.event.Undo;
        for (const p of traces)
          if (p.seq >= from && p.seq < to)
            p.reverted = true;
      }
      traces.push(t);
    }
    simResults.set(hash, {
      status: 'done',
      analysis: wasmAnalyse(traces),
      nonceCheck: await noncePromise,
    });
  } catch (e) {
    simResults.set(hash, {
      status: 'failed',
      error: (e && e.message) || String(e),
      nonceCheck: await noncePromise.catch(() => null),
    });
  }
  render();
}

// chainId -> display name. Covers the gate's seeded chains plus a few common
// ones; anything else shows as "chain <n>". `tx.chainId` arrives as a hex string
// (zero-padded Hex<8>), so parse it as base-16.
const CHAIN_NAMES = {
  1: 'Ethereum',
  10: 'Optimism',
  56: 'BNB Chain',
  100: 'Gnosis',
  137: 'Polygon',
  8453: 'Base',
  42161: 'Arbitrum',
  43114: 'Avalanche',
  11155111: 'Sepolia',
};
// tx.chainId arrives as a hex string (zero-padded Hex<8>); normalize to a number
// for both the label lookup and the per-chain address registry keys.
function _chainId(chainId) {
  return typeof chainId === 'number' ? chainId : parseInt(chainId, 16);
}
function _chainLabel(chainId) {
  const n = _chainId(chainId);
  return CHAIN_NAMES[n] ?? `chain ${n}`;
}

function render() {
  const el = document.getElementById('list');
  if (!currentList.length) {
    el.innerHTML = '<p class="empty">No pending transactions.</p>';
    return;
  }

  el.innerHTML = currentList.map(({ hash, from, call, tx }) => {
    const sim = simResults.get(hash) || { status: 'pending' };
    const cid = _chainId(tx?.chainId);
    const gas = sim.analysis?.fee?.gasUsed;
    const meta = sim.status === 'done'
      ? (gas != null ? `<span>gas: ${Number(gas).toLocaleString()}</span>` : '')
      : sim.status === 'failed'
      ? `<span class="bad">${sim.error}</span>`
      : '<span>simulating…</span>';
    const fromLine = from && from.toLowerCase() !== (address || '').toLowerCase()
      ? `<div class="from">from: ${from}</div>` : '';
    const toLine = `<div class="from">${call && call.to ? 'to: ' + _fmtAcc(call.to, cid) : '(create)'}</div>`;
    const actions = `
      <div class="actions">
        ${sim.status === 'done' ? `<button class="btn" onclick="submit('${hash}')">Submit</button>` : ''}
        <button class="btn danger" onclick="remove('${hash}')">Remove</button>
      </div>`;
    return `<div class="card">
      <div class="hash-row">
        <span class="hash">${hash}</span>
        <span class="chain-chip">${_chainLabel(tx?.chainId)}</span>
      </div>
      ${fromLine}
      ${toLine}
      <div class="status ${sim.status}">${sim.status.toUpperCase()}</div>
      <div class="meta">${meta}</div>
      ${renderNonceWarning(sim)}
      ${sim.status === 'done' ? renderAnalysis(sim.analysis, cid) : ''}
      ${actions}
    </div>`;
  }).join('');

  // Resolve ENS names for the addresses just rendered; re-renders if any resolve.
  // Idempotent (cached), so this settles after one enrichment pass.
  enrichEns();
}

async function load() {
  if (!token) {
    document.getElementById('list').innerHTML = '<p class="empty">Connect wallet to view transactions.</p>';
    return;
  }

  const res = await fetch('/api/txs', { headers: authHeaders() });
  if (res.status === 401) {
    signOut();
    return;
  }

  currentList = await res.json();
  render();

  if (wasmReady) for (const item of currentList) {
    if (!simResults.has(item.hash)) simulateCard(item);
  }
}

// Look up an address on a given chain; falls back to chain-agnostic precompiles.
function _known(chainId, hex) {
  const a = hex?.toLowerCase?.();
  if (!a) return null;
  return KNOWN_ADDRS[chainId]?.[a] ?? COMMON_ADDRS[a] ?? null;
}

// ENS reverse resolution (address -> primary name)
//
// Always queries mainnet (chain 1) via the gate's RPC proxy, using the ENS
// Universal Resolver's reverse() - which forward-verifies (resolves the claimed
// name back to the address). Verification matters here: an unverified reverse
// record can *claim* any name (e.g. "vitalik.eth"), which in a firewall would be
// a spoofing vector. reverse() reverts for addresses with no primary name.
const ENS_UNIVERSAL_RESOLVER = '0xce01f8eee7e479c928f8919abd53e553a36cef67';
// address(lowercase) -> name | null. null = resolved, no name.
const ensCache = new Map();

// DNS-wire-encode "<addr_hex_lower>.addr.reverse": [len][label]…[0x00]. No hashing.
function _ensReverseName(addr) {
  let hex = '';
  for (const label of [addr.toLowerCase().replace(/^0x/, ''), 'addr', 'reverse']) {
    hex += label.length.toString(16).padStart(2, '0');
    for (let i = 0; i < label.length; i++) hex += label.charCodeAt(i).toString(16).padStart(2, '0');
  }
  return hex + '00';
}

// abi-encode reverse(bytes): selector + offset(0x20) + length + right-padded data.
function _ensCalldata(addr) {
  const dns = _ensReverseName(addr);
  const pad = '0'.repeat((64 - (dns.length % 64)) % 64);
  return '0xec11c823'
    + (32).toString(16).padStart(64, '0')
    + (dns.length / 2).toString(16).padStart(64, '0')
    + dns + pad;
}

async function ensReverse(addr) {
  const key = addr.toLowerCase();
  if (ensCache.has(key)) return ensCache.get(key);
  ensCache.set(key, null); // mark before awaiting so concurrent callers dedupe
  try {
    const res = await fetch('/rpc/1', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_call',
        params: [{ to: ENS_UNIVERSAL_RESOLVER, data: _ensCalldata(addr) }, 'latest'] }),
    });
    const j = await res.json();
    if (!j.result || j.result === '0x') return null;   // revert => no primary name
    const hex = j.result.slice(2);
    // returns (string name, address resolvedAddress, address, address)
    const resolved = '0x' + hex.slice(64 + 24, 128);   // word[1] low 20 bytes
    if (resolved.toLowerCase() !== key) return null;    // belt-and-suspenders verify
    const off = parseInt(hex.slice(0, 64), 16) * 2;     // word[0]: offset to string
    const len = parseInt(hex.slice(off, off + 64), 16);
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = parseInt(hex.substr(off + 64 + i * 2, 2), 16);
    const name = new TextDecoder().decode(bytes) || null;
    ensCache.set(key, name);
    return name;
  } catch { return null; }
}

// After a render, resolve ENS for the (human, likely-EOA) addresses on screen and
// re-render once names arrive. Token/router contracts are already symbol-labelled
// and won't have primary names, so we skip anything with a known symbol.
async function enrichEns() {
  const addrs = new Set();
  const add = a => { if (a && !_known(1, a)) addrs.add(a.toLowerCase()); };
  if (address) add(address);
  for (const it of currentList) {
    add(it.from); add(it.call?.to);
    const a = simResults.get(it.hash)?.analysis;
    if (!a) continue;
    (a.ethChanges || []).forEach(c => add(c.acc));
    (a.erc20Transfers || []).forEach(t => { add(t.from); add(t.to); });
    (a.erc721Transfers || []).forEach(t => { add(t.from); add(t.to); });
    (a.erc20Approvals || []).forEach(p => { add(p.owner); add(p.spender); });
  }
  const pending = [...addrs].filter(a => !ensCache.has(a));
  if (!pending.length) return;
  const names = await Promise.all(pending.map(ensReverse));
  if (names.some(Boolean)) { render(); updateHeader(); }
}

function _fmtAcc(hex, chainId, short = false) {
  const known = _known(chainId, hex);
  if (known) return known.symbol;
  const ens = hex && ensCache.get(hex.toLowerCase());  // forward-verified name, if any
  if (ens) return ens;
  if (!short) {
    return hex;
  }
  return hex.length <= 21 ? hex : hex.slice(0, 7) + '...' + hex.slice(-5);
}

function _fmtAmount(token, amount, chainId) {
  if (amount == null) return '?';
  let raw;
  try { raw = BigInt(amount); } catch { return String(amount); }
  const known = _known(chainId, token);
  if (known?.decimals == null) return raw.toLocaleString();
  const base = 10n ** BigInt(known.decimals);
  const whole = raw / base, frac = raw % base;
  if (frac === 0n) return whole.toLocaleString();
  const fracStr = frac.toString().padStart(known.decimals, '0').replace(/0+$/, '').slice(0, 6);
  return `${whole.toLocaleString()}.${fracStr}`;
}

// A wei value (hex or BigInt) as human ETH: whole ETH down to 6 fractional
// digits, or raw wei for dust below 1e-6 ETH. "0" for zero/empty.
function _fmtValue(val) {
  if (val == null) return '0';
  let wei;
  try { wei = BigInt(val); } catch { return String(val); }
  if (wei === 0n) return '0';
  const ETH = 10n ** 18n, MICRO = 10n ** 12n;
  if (wei < MICRO) return `${wei} wei`;
  const whole = wei / ETH, frac = wei % ETH;
  if (frac === 0n) return `${whole} ETH`;
  const fracStr = frac.toString().padStart(18, '0').replace(/0+$/, '').slice(0, 6);
  return `${whole}.${fracStr} ETH`;
}

// Signed ETH delta (BigInt) -> "+1.5 ETH" / "−0.2 ETH".
function _fmtDelta(delta) {
  const pos = delta > 0n;
  const abs = pos ? delta : -delta;
  return (pos ? '+' : '-') + _fmtValue('0x' + abs.toString(16));
}

// Nonce badge: shown only when the signed tx's nonce doesn't line up with the
// sender's on-chain nonce. This is gate-side metadata (is the tx broadcastable
// right now?), deliberately kept out of renderAnalysis (which renders the lens).
function renderNonceWarning(sim) {
  const nc = sim.nonceCheck;
  if (!nc || nc.status === 'ok') return '';
  if (nc.status === 'queued') {
    return `<div class="analysis"><div class="an-row caution">
      <span class="an-label yel">Queued</span>
      <span class="an-addr">nonce ${nc.txNonce} follows ${nc.ahead} earlier pending tx(s); account nonce is ${nc.accountNonce}</span>
    </div></div>`;
  }
  const msg = nc.status === 'behind'
    ? `nonce ${nc.txNonce} is behind account nonce ${nc.accountNonce} — already used, this tx cannot be mined`
    : `nonce ${nc.txNonce} is ahead of account nonce ${nc.accountNonce} — a gap; the tx stays queued until the earlier nonces are used`;
  return `<div class="analysis"><div class="an-row warn">
    <span class="an-label red">⚠ Nonce ${nc.status}</span>
    <span class="an-addr">${msg}</span>
  </div></div>`;
}

// Render analyse() output (a lens `Alerts`): the structured effects of the tx,
// not the raw event stream. `chainId` selects the address/token registry so
// labels and decimals match the chain the tx was captured on. Empty struct ->
// an explicit "nothing notable" note.
function renderAnalysis(a, chainId) {
  if (!a) return '';
  const acc = h => _fmtAcc(h, chainId);
  const amt = (token, v) => _fmtAmount(token, v, chainId);
  const sections = [];

  if (a.proxySwaps?.length) {
    sections.push(a.proxySwaps.map(s => `
      <div class="an-row warn">
        <span class="an-label red">⚠ Proxy implementation replaced</span>
        <span class="an-addr">${acc(s.proxy)}</span>
        <span><span class="an-val">${acc(s.oldImpl)}</span> → <span class="an-val new">${acc(s.newImpl)}</span></span>
      </div>`).join(''));
  }

  if (a.ethChanges?.length) {
    const sender = a.fee?.sender?.toLowerCase?.();
    const coinbase = a.fee?.coinbase?.toLowerCase?.();
    // Multiple entries per account are possible; sum their per-entry deltas.
    const byAcc = new Map();
    for (const c of a.ethChanges) {
      const key = c.acc?.toLowerCase?.() ?? c.acc;
      const delta = BigInt(c.after) - BigInt(c.before);
      byAcc.set(key, { acc: c.acc, delta: (byAcc.get(key)?.delta ?? 0n) + delta });
    }
    const rows = [...byAcc.values()].filter(c => c.delta !== 0n).map(c => {
      const key = c.acc?.toLowerCase?.() ?? c.acc;
      const role = key === sender ? 'sender' : key === coinbase ? 'coinbase' : null;
      const pos = c.delta > 0n;
      return `
        <div class="an-row neutral">
          <span class="an-label dim">ETH${role ? ` <span class="an-role">${role}</span>` : ''}</span>
          <span class="an-addr">${acc(c.acc)}</span>
          <span class="${pos ? 'an-pos' : 'an-neg'}">${_fmtDelta(c.delta)}</span>
        </div>`;
    }).join('');
    if (rows) sections.push(`<div><div class="an-section-title">ETH balance changes</div>${rows}</div>`);
  }

  if (a.erc20Transfers?.length) {
    const rows = a.erc20Transfers.map(t => `
      <div class="an-row neutral">
        <span class="an-label dim">${acc(t.token)}</span>
        <span class="an-addr">${acc(t.from)} → ${acc(t.to)}</span>
        <span class="an-val">${amt(t.token, t.amount)}</span>
      </div>`).join('');
    sections.push(`<div><div class="an-section-title">ERC-20 transfers</div>${rows}</div>`);
  }

  if (a.erc721Transfers?.length) {
    const rows = a.erc721Transfers.map(t => `
      <div class="an-row neutral">
        <span class="an-label dim">${acc(t.token)}</span>
        <span class="an-addr">${acc(t.from)} → ${acc(t.to)}</span>
        <span class="an-val">Token ID: ${t.tokenId != null ? BigInt(t.tokenId).toLocaleString() : '?'}</span>
      </div>`).join('');
    sections.push(`<div><div class="an-section-title">ERC-721 transfers</div>${rows}</div>`);
  }

  if (a.erc20Approvals?.length) {
    const MAX_UINT256 = (1n << 256n) - 1n;
    const rows = a.erc20Approvals.map(ap => {
      const val = ap.allowance != null ? BigInt(ap.allowance) : null;
      const revoke = val === 0n;
      const valStr = val == null ? '?' : val === MAX_UINT256 ? 'Unlimited' : amt(ap.token, val);
      return `
        <div class="an-row ${revoke ? 'neutral' : 'caution'}">
          <span class="an-label ${revoke ? 'dim' : 'yel'}">${acc(ap.token)}</span>
          <span class="an-addr">${acc(ap.owner)} → ${acc(ap.spender)}</span>
          <span class="an-val">${valStr}</span>
        </div>`;
    }).join('');
    sections.push(`<div><div class="an-section-title">ERC-20 approvals</div>${rows}</div>`);
  }

  if (a.forgedTransfers?.length) {
    const rows = a.forgedTransfers.map(t => `
      <div class="an-row warn">
        <span class="an-label red">⚠ Forged transfer (log without state change)</span>
        <span class="an-addr">ERC-20 ${acc(t.token)}</span>
        <span class="an-addr">${acc(t.from)} → ${acc(t.to)}</span>
      </div>`).join('');
    sections.push(`<div>${rows}</div>`);
  }

  if (!sections.length) return '<div class="an-empty">No notable effects detected.</div>';
  return `<div class="analysis">${sections.join('')}</div>`;
}

async function submit(hash) {
  await fetch('/api/txs/' + hash + '/submit', { method: 'POST', headers: authHeaders() });
  load();
}

async function remove(hash) {
  await fetch('/api/txs/' + hash, { method: 'DELETE', headers: authHeaders() });
  load();
}

// Escape a value for safe interpolation into an HTML attribute.
function _attr(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

async function openSettings() {
  document.getElementById('settings-note').textContent = isAdmin
    ? 'Admin: saving writes to the shared, server-side registry (affects all users).'
    : 'Changes are saved to this browser only (local override) and never affect other users.';
  const sb = getSimBlock();
  document.getElementById('sim-block-input').value = sb == null ? '' : String(sb);
  document.getElementById('add-chain-err').textContent = '';
  document.getElementById('settings').classList.add('open');
  await renderChainRows();
}

// Header banner making a pinned simulation block obvious (it's not "latest").
function updateSimBanner() {
  const b = getSimBlock();
  const el = document.getElementById('sim-banner');
  if (b == null) { el.classList.remove('on'); el.textContent = ''; return; }
  el.textContent = `⛓ simulating against block ${b.toLocaleString()} (not latest) — needs an archive RPC for old blocks`;
  el.classList.add('on');
}

// Apply the "simulate against block" setting, then re-run all card simulations so
// results reflect the new block immediately.
async function applySimBlock() {
  const raw = document.getElementById('sim-block-input').value.trim();
  if (raw !== '' && !/^\d+$/.test(raw)) {
    document.getElementById('add-chain-err').textContent = 'Block must be a number, or blank for latest';
    return;
  }
  setSimBlock(raw);
  updateSimBanner();
  closeSettings();
  simResults.clear();              // drop results computed against the old block
  for (const item of currentList) if (wasmReady) simulateCard(item);
  render();
}
function closeSettings() {
  document.getElementById('settings').classList.remove('open');
}

// Rows = union of the global registry and this browser's overrides. Each row's
// URL is editable; an override (if any) shadows the global entry.
async function renderChainRows() {
  const global = await loadGlobalChains(true);
  const overrides = loadOverrides();
  const ids = [...new Set([
    ...Object.keys(global).map(Number),
    ...Object.keys(overrides).map(Number),
  ])].sort((a, b) => a - b);

  const rows = ids.map(id => {
    const hasOverride = overrides[String(id)] != null;
    const url = hasOverride ? overrides[String(id)] : global[id];
    const name = CHAIN_NAMES[id] ? ` <span class="cname">${CHAIN_NAMES[id]}</span>` : '';
    const badge = hasOverride
      ? '<span class="src-badge local">local</span>'
      : '<span class="src-badge global">global</span>';
    // Remove is possible when there's a local override to drop, or (admin) a
    // global entry to delete. A non-admin can't remove a purely global chain.
    const canRemove = hasOverride || (isAdmin && global[id] != null);
    return `<div class="chain-row" data-id="${id}">
      <span class="chain-id">0x${id.toString(16)}${name}</span>
      <input class="chain-url" value="${_attr(url)}">
      ${badge}
      <button class="btn sm" onclick="saveChain(${id})">Save</button>
      <button class="btn sm danger" onclick="removeChain(${id})" ${canRemove ? '' : 'disabled'}>Drop</button>
    </div>
    <div class="chain-err" id="chain-err-${id}"></div>`;
  }).join('');

  document.getElementById('chain-rows').innerHTML =
    rows || '<div class="modal-note">No chains configured.</div>';
}

// POST a global chain entry (admin only). The gate verifies the RPC actually
// serves that chain before storing. Returns an error string, or null on success.
async function putGlobalChain(id, url) {
  try {
    const res = await fetch('/chain/0x' + id.toString(16), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ rpc: url }),
    });
    if (res.ok) return null;
    const j = await res.json().catch(() => ({}));
    return j.error || ('HTTP ' + res.status);
  } catch (e) { return (e && e.message) || String(e); }
}

async function saveChain(id) {
  const row = document.querySelector(`.chain-row[data-id="${id}"]`);
  const url = row.querySelector('.chain-url').value.trim();
  const errEl = document.getElementById('chain-err-' + id);
  errEl.textContent = '';
  if (!url) { errEl.textContent = 'URL required'; return; }
  if (isAdmin) {
    const e = await putGlobalChain(id, url);
    if (e) { errEl.textContent = e; return; }
    removeOverride(id);
    await loadGlobalChains(true);
  } else {
    saveOverride(id, url);
  }
  await renderChainRows();
}

async function removeChain(id) {
  const errEl = document.getElementById('chain-err-' + id);
  if (errEl) errEl.textContent = '';
  if (loadOverrides()[String(id)] != null) {
    removeOverride(id);
  } else if (isAdmin) {
    try {
      const res = await fetch('/chain/0x' + id.toString(16), { method: 'DELETE', headers: authHeaders() });
      if (!res.ok) {
        const j = await res.json().catch(() => ({}));
        if (errEl) errEl.textContent = j.error || ('HTTP ' + res.status);
        return;
      }
    } catch (e) { if (errEl) errEl.textContent = (e && e.message) || String(e); return; }
    await loadGlobalChains(true);
  } else {
    return;
  }
  await renderChainRows();
}

async function addChain() {
  const idStr = document.getElementById('add-chain-id').value.trim();
  const url = document.getElementById('add-chain-url').value.trim();
  const errEl = document.getElementById('add-chain-err');
  errEl.textContent = '';
  // Accept "8453" (decimal) or "0x2105" (hex); the API path is always sent hex.
  const id = idStr.toLowerCase().startsWith('0x') ? parseInt(idStr, 16) : parseInt(idStr, 10);
  if (!Number.isInteger(id) || id <= 0) { errEl.textContent = 'Invalid chain id'; return; }
  if (!url) { errEl.textContent = 'URL required'; return; }
  if (isAdmin) {
    const e = await putGlobalChain(id, url);
    if (e) { errEl.textContent = e; return; }
    await loadGlobalChains(true);
  } else {
    saveOverride(id, url);
  }
  document.getElementById('add-chain-id').value = '';
  document.getElementById('add-chain-url').value = '';
  await renderChainRows();
}

updateHeader();
updateSimBanner();
load();
setInterval(load, 30000);
loadWasm();

</script>
