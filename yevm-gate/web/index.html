  .wallet-menu { display: none; position: absolute; top: calc(100% + 6px); right: 0; min-width: 21ch;
                 background: #10162a; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px;
                 overflow: hidden; z-index: 10; }

  .wallet-menu button { display: block; width: 100%; text-align: left; padding: 8px 12px; background: none;
                         border: none; color: #e2e8f0; font-family: monospace; font-size: 0.85em; cursor: pointer; }
  .wallet-menu button:hover { background: rgba(56,189,248,0.12); }

  .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 14px 16px; }
  .hash-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .hash { color: #94a3b8; font-size: 0.85em; margin-bottom: 4px; word-break: break-all; }
  .hash-row .hash { margin-bottom: 0; flex: 1; min-width: 0; }
  .chain-chip { flex: none; font-size: 0.72em; color: #7dd3fc; background: rgba(56,189,248,0.12);
                border: 1px solid rgba(56,189,248,0.3); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
  .from { color: #64748b; font-size: 0.78em; margin-bottom: 8px; }
  .status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; font-weight: 600; margin-bottom: 8px; }
  .status.pending { background: rgba(251,191,36,0.15);  color: #fbbf24; }
  .status.done    { background: rgba(74,222,128,0.15);  color: #4ade80; }
  .status.failed  { background: rgba(248,113,113,0.15); color: #f87171; }

  .meta .ok  { color: #4ade80; }

  .actions { display: flex; gap: 8px; }

         padding: 6px 16px; border-radius: 6px; cursor: pointer; font-family: monospace; font-size: 0.85em; }

<body>
<div class="header">
  <h1>yevm · gate</h1>
  <div class="session-wrap">
    <button id="session" class="btn" onclick="onSessionClick()">Connect Wallet</button>
    <div id="wallet-menu" class="wallet-menu"></div>
  </div>
</div>
<div id="list"></div>
<script>
let token = localStorage.getItem('yevm_gate_token');
let address = localStorage.getItem('yevm_gate_address');
let isAdmin = localStorage.getItem('yevm_gate_admin') === '1';

function authHeaders() {
  return token ? { 'Authorization': 'Bearer ' + token } : {};
}

let wasmReady = false;
let wasmExecute = null;
let wasmAnalyse = null;
async function loadWasm() {
  try {
    const mod = await import('/static/yevm_wasm.js');
    await mod.default();
    wasmExecute = mod.execute;
    wasmAnalyse = mod.analyse;
    wasmReady = true;
  } catch (e) {
    console.error('wasm init failed', e);
  }
  // Simulate any cards that were rendered before the simulator was ready.
  for (const item of currentList) {
    if (!simResults.has(item.hash) && wasmReady) simulateCard(item);
  }
}

async function connect(provider) {
  if (!provider) { alert('No wallet detected.'); return; }

  const accounts = await provider.request({ method: 'eth_requestAccounts' });
  if (!accounts || !accounts.length) {
    alert('Wallet returned no accounts - unlock it and select an account, then try again.');
    return;
  }
  const account = accounts[0];
  const chainId = parseInt(await provider.request({ method: 'eth_chainId' }), 16);

  const { nonce } = await fetch('/auth/challenge').then(r => r.json());

  const now = new Date();
  const exp = new Date(now.getTime() + 60_000);
  const message = [
    `${location.host} wants you to sign in with your Ethereum account:`,
    account,
    '',
    'Sign in to yevm-gate',
    '',
    `URI: ${location.origin}`,
    'Version: 1',
    `Chain ID: ${chainId}`,
    `Nonce: ${nonce}`,
    `Issued At: ${now.toISOString()}`,
    `Expiration Time: ${exp.toISOString()}`,
  ].join('\n');

  const msgHex = '0x' + Array.from(new TextEncoder().encode(message), b => b.toString(16).padStart(2, '0')).join('');
  const signature = await provider.request({ method: 'personal_sign', params: [msgHex, account] });

  const res = await fetch('/auth/verify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, signature }),
  });
  if (!res.ok) { alert('Auth failed: ' + (await res.json()).error); return; }

  const data = await res.json();
  token = data.token;
  address = data.address;
  isAdmin = !!data.admin;
  localStorage.setItem('yevm_gate_token', token);
  localStorage.setItem('yevm_gate_address', address);
  localStorage.setItem('yevm_gate_admin', isAdmin ? '1' : '0');

  updateHeader();
  load();
}

function updateHeader() {
  const btn = document.getElementById('session');
  btn.textContent = address ? _fmtAcc(address, null, true) : 'Connect Wallet';
}

// EIP-6963 (Multi Injected Provider Discovery): each installed wallet extension
// announces itself here instead of everyone fighting over window.ethereum. The
// listener must be registered before the request is dispatched, or announcements
// made synchronously in response to it would be missed.
const wallets = []; // { info: { uuid, name, icon, rdns }, provider }
window.addEventListener('eip6963:announceProvider', (event) => {
  const { info, provider } = event.detail;
  if (!wallets.some(w => w.info.uuid === info.uuid)) {
    wallets.push({ info, provider });
    if (!address) closeWalletMenu(); // list changed; close so the next click re-renders it
  }
});
window.dispatchEvent(new Event('eip6963:requestProvider'));

function closeWalletMenu() {
  document.getElementById('wallet-menu').classList.remove('open');
}

function openWalletMenu() {
  const menu = document.getElementById('wallet-menu');
  menu.innerHTML = '';
  wallets.forEach((w, i) => {
    const btn = document.createElement('button');
    btn.textContent = w.info.name;
    btn.onclick = () => selectWallet(i);
    menu.appendChild(btn);
  });
  menu.classList.add('open');
}

function selectWallet(i) {
  closeWalletMenu();
  connect(wallets[i].provider);
}

// Click outside the button/menu closes the menu.
document.addEventListener('click', (e) => {
  if (!e.target.closest('.session-wrap')) closeWalletMenu();
});

function onSessionClick() {
  if (address) {
    closeWalletMenu();
    if (confirm(`Sign out of ${address}?`)) signOut();
    return;
  }
  if (wallets.length >= 2) {
    document.getElementById('wallet-menu').classList.contains('open')
      ? closeWalletMenu()
      : openWalletMenu();
    return;
  }
  // Zero or one EIP-6963 wallet: fall back to the legacy single-provider global.
  const provider = wallets[0]?.provider || window.ethereum;
  if (!provider) { alert('No wallet detected.'); return; }
  connect(provider);
}

function signOut() {
  token = null;
  address = null;
  isAdmin = false;
  localStorage.removeItem('yevm_gate_token');
  localStorage.removeItem('yevm_gate_address');
  localStorage.removeItem('yevm_gate_admin');
  currentList = [];
  simResults.clear();
  updateHeader();
  load();
}

// The chainId -> RPC url map used both to resolve where to simulate a pending
// tx and (once submitted) where to broadcast it. Fetched once and cached; the
// gate is the only party that manages this registry, so it doesn't change
// mid-session under normal use.
let chainUrls = null;
async function loadChains() {
  if (!chainUrls) {
    const res = await fetch('/chain', { headers: authHeaders() });
    const raw = res.ok ? await res.json() : {};
    // Keyed by numeric chain id, not the raw hex string: /chain's keys ("0x1")
    // and a decoded tx's chainId ("0x0000000000000001", a zero-padded Hex<8>)
    // are both valid hex for the same chain but spelled differently.
    chainUrls = {};
    for (const [hex, url] of Object.entries(raw)) chainUrls[parseInt(hex, 16)] = url;
  }
  return chainUrls;
}

let currentList = [];
// hash -> { status: 'pending'|'done'|'failed', analysis, error }
const simResults = new Map();

// Run the decoded pending tx (exactly as signed - real nonce/fees/access list)
// against the chain it was captured on. Never touches `raw`: simulation only
// needs the decoded `call`/`tx` the API already returned. The raw event stream
// is fed straight into analyse() - we surface the structured effects it derives
// (ETH/token movements, approvals, proxy swaps), not the individual events.
async function simulateCard(item) {
  const { hash, tx } = item;
  simResults.set(hash, { status: 'pending' });
  render();
  try {
    const urls = await loadChains();
    const url = urls[parseInt(tx.chainId, 16)];
    if (!url) throw new Error(`no RPC configured for chain ${tx.chainId}`);
    const EVENT_FILTER = 0xFFFFFFFF - 1; // exclude STEP events
    const stream = await wasmExecute(url, item.call, tx, EVENT_FILTER);
    const traces = [];
    for (;;) {
      const t = await stream.next();
      if (t == null) break;
      if (t.event && t.event.Undo) {
        // mark the reverted span for analyse() to be aware of it.
        const [from, to] = t.event.Undo;
        for (const p of traces) 
          if (p.seq >= from && p.seq < to) 
            p.reverted = true;
      }
      traces.push(t);
    }
    simResults.set(hash, {
      status: 'done',
      analysis: wasmAnalyse(traces),
    });
  } catch (e) {
    simResults.set(hash, { status: 'failed', error: (e && e.message) || String(e) });
  }
  render();
}

// chainId -> display name. Covers the gate's seeded chains plus a few common
// ones; anything else shows as "chain <n>". `tx.chainId` arrives as a hex string
// (zero-padded Hex<8>), so parse it as base-16.
const CHAIN_NAMES = {
  1: 'Ethereum',
  10: 'Optimism',
  56: 'BNB Chain',
  100: 'Gnosis',
  137: 'Polygon',
  8453: 'Base',
  42161: 'Arbitrum',
  43114: 'Avalanche',
  11155111: 'Sepolia',
};
// tx.chainId arrives as a hex string (zero-padded Hex<8>); normalize to a number
// for both the label lookup and the per-chain address registry keys.
function _chainId(chainId) {
  return typeof chainId === 'number' ? chainId : parseInt(chainId, 16);
}
function _chainLabel(chainId) {
  const n = _chainId(chainId);
  return CHAIN_NAMES[n] ?? `chain ${n}`;
}

function render() {
  const el = document.getElementById('list');
  if (!currentList.length) {
    el.innerHTML = '<p class="empty">No pending transactions.</p>';
    return;
  }

  el.innerHTML = currentList.map(({ hash, from, call, tx }) => {
    const sim = simResults.get(hash) || { status: 'pending' };
    const cid = _chainId(tx?.chainId);
    const gas = sim.analysis?.fee?.gasUsed;
    const meta = sim.status === 'done'
      ? (gas != null ? `<span>gas: ${Number(gas).toLocaleString()}</span>` : '')
      : sim.status === 'failed'
      ? `<span class="bad">${sim.error}</span>`
      : '<span>simulating…</span>';
    const fromLine = from && from.toLowerCase() !== (address || '').toLowerCase()
      ? `<div class="from">from: ${from}</div>` : '';
    const toLine = `<div class="from">${call && call.to ? 'to: ' + _fmtAcc(call.to, cid) : '(create)'}</div>`;
    const actions = `
      <div class="actions">
        ${sim.status === 'done' ? `<button class="btn" onclick="submit('${hash}')">Submit</button>` : ''}
        <button class="btn danger" onclick="remove('${hash}')">Remove</button>
      </div>`;
    return `<div class="card">
      <div class="hash-row">
        <span class="hash">${hash}</span>
        <span class="chain-chip">${_chainLabel(tx?.chainId)}</span>
      </div>
      ${fromLine}
      ${toLine}
      <div class="status ${sim.status}">${sim.status.toUpperCase()}</div>
      <div class="meta">${meta}</div>
      ${sim.status === 'done' ? renderAnalysis(sim.analysis, cid) : ''}
      ${actions}
    </div>`;
  }).join('');
}

async function load() {
  if (!token) {
    document.getElementById('list').innerHTML = '<p class="empty">Connect wallet to view transactions.</p>';
    return;
  }

  const res = await fetch('/api/txs', { headers: authHeaders() });
  if (res.status === 401) {
    signOut();
    return;
  }

  currentList = await res.json();
  render();

  if (wasmReady) for (const item of currentList) {
    if (!simResults.has(item.hash)) simulateCard(item);
  }
}

    '0xaf88d065e77c8cc2239327c5edb3a432268e5831': { symbol: 'USDC',   decimals: 6  },
    '0xff970a61a04b1ca14834a43f5de4533ebddb5cc8': { symbol: 'USDC.e', decimals: 6  },
    '0xfd086bc7cd5c481dcc9c85ebe478a1c0b69fcbb9': { symbol: 'USDT',   decimals: 6  },

    '0x2f2a2543b76a4166549f7aab2e75bef0aefc5b0f': { symbol: 'WBTC',   decimals: 8  },

// Look up an address on a given chain; falls back to chain-agnostic precompiles.
function _known(chainId, hex) {
  const a = hex?.toLowerCase?.();
  if (!a) return null;
  return KNOWN_ADDRS[chainId]?.[a] ?? COMMON_ADDRS[a] ?? null;
}

function _fmtAcc(hex, chainId, short = false) {
  const known = _known(chainId, hex);
  if (known) return known.symbol;
  if (!short) {
    return hex;
  }
  return hex.length <= 21 ? hex : hex.slice(0, 7) + '...' + hex.slice(-5);
}

function _fmtAmount(token, amount, chainId) {
  if (amount == null) return '?';
  let raw;
  try { raw = BigInt(amount); } catch { return String(amount); }
  const known = _known(chainId, token);
  if (known?.decimals == null) return raw.toLocaleString();
  const base = 10n ** BigInt(known.decimals);
  const whole = raw / base, frac = raw % base;
  if (frac === 0n) return whole.toLocaleString();
  const fracStr = frac.toString().padStart(known.decimals, '0').replace(/0+$/, '').slice(0, 6);
  return `${whole.toLocaleString()}.${fracStr}`;
}

// A wei value (hex or BigInt) as human ETH: whole ETH down to 6 fractional
// digits, or raw wei for dust below 1e-6 ETH. "0" for zero/empty.
function _fmtValue(val) {
  if (val == null) return '0';
  let wei;
  try { wei = BigInt(val); } catch { return String(val); }
  if (wei === 0n) return '0';
  const ETH = 10n ** 18n, MICRO = 10n ** 12n;
  if (wei < MICRO) return `${wei} wei`;
  const whole = wei / ETH, frac = wei % ETH;
  if (frac === 0n) return `${whole} ETH`;
  const fracStr = frac.toString().padStart(18, '0').replace(/0+$/, '').slice(0, 6);
  return `${whole}.${fracStr} ETH`;
}

// Signed ETH delta (BigInt) -> "+1.5 ETH" / "−0.2 ETH".
function _fmtDelta(delta) {
  const pos = delta > 0n;
  const abs = pos ? delta : -delta;
  return (pos ? '+' : '-') + _fmtValue('0x' + abs.toString(16));
}

// Render analyse() output (a lens `Alerts`): the structured effects of the tx,
// not the raw event stream. `chainId` selects the address/token registry so
// labels and decimals match the chain the tx was captured on. Empty struct ->
// an explicit "nothing notable" note.
function renderAnalysis(a, chainId) {
  if (!a) return '';
  const acc = h => _fmtAcc(h, chainId);
  const amt = (token, v) => _fmtAmount(token, v, chainId);
  const sections = [];

  if (a.proxySwaps?.length) {
    sections.push(a.proxySwaps.map(s => `
      <div class="an-row warn">
        <span class="an-label red">⚠ Proxy implementation replaced</span>
        <span class="an-addr">${acc(s.proxy)}</span>
        <span><span class="an-val">${acc(s.oldImpl)}</span> → <span class="an-val new">${acc(s.newImpl)}</span></span>
      </div>`).join(''));
  }

  if (a.ethChanges?.length) {
    const sender = a.fee?.sender?.toLowerCase?.();
    const coinbase = a.fee?.coinbase?.toLowerCase?.();
    // Multiple entries per account are possible; sum their per-entry deltas.
    const byAcc = new Map();
    for (const c of a.ethChanges) {
      const key = c.acc?.toLowerCase?.() ?? c.acc;
      const delta = BigInt(c.after) - BigInt(c.before);
      byAcc.set(key, { acc: c.acc, delta: (byAcc.get(key)?.delta ?? 0n) + delta });
    }
    const rows = [...byAcc.values()].filter(c => c.delta !== 0n).map(c => {
      const key = c.acc?.toLowerCase?.() ?? c.acc;
      const role = key === sender ? 'sender' : key === coinbase ? 'coinbase' : null;
      const pos = c.delta > 0n;
      return `
        <div class="an-row neutral">
          <span class="an-label dim">ETH${role ? ` <span class="an-role">${role}</span>` : ''}</span>
          <span class="an-addr">${acc(c.acc)}</span>
          <span class="${pos ? 'an-pos' : 'an-neg'}">${_fmtDelta(c.delta)}</span>
        </div>`;
    }).join('');
    if (rows) sections.push(`<div><div class="an-section-title">ETH balance changes</div>${rows}</div>`);
  }

  if (a.erc20Transfers?.length) {
    const rows = a.erc20Transfers.map(t => `
      <div class="an-row neutral">
        <span class="an-label dim">${acc(t.token)}</span>
        <span class="an-addr">${acc(t.from)} → ${acc(t.to)}</span>
        <span class="an-val">${amt(t.token, t.amount)}</span>
      </div>`).join('');
    sections.push(`<div><div class="an-section-title">ERC-20 transfers</div>${rows}</div>`);
  }

  if (a.erc721Transfers?.length) {
    const rows = a.erc721Transfers.map(t => `
      <div class="an-row neutral">
        <span class="an-label dim">${acc(t.token)}</span>
        <span class="an-addr">${acc(t.from)} → ${acc(t.to)}</span>
        <span class="an-val">Token ID: ${t.tokenId != null ? BigInt(t.tokenId).toLocaleString() : '?'}</span>
      </div>`).join('');
    sections.push(`<div><div class="an-section-title">ERC-721 transfers</div>${rows}</div>`);
  }

  if (a.erc20Approvals?.length) {
    const MAX_UINT256 = (1n << 256n) - 1n;
    const rows = a.erc20Approvals.map(ap => {
      const val = ap.allowance != null ? BigInt(ap.allowance) : null;
      const revoke = val === 0n;
      const valStr = val == null ? '?' : val === MAX_UINT256 ? 'Unlimited' : amt(ap.token, val);
      return `
        <div class="an-row ${revoke ? 'neutral' : 'caution'}">
          <span class="an-label ${revoke ? 'dim' : 'yel'}">${acc(ap.token)}</span>
          <span class="an-addr">${acc(ap.owner)} → ${acc(ap.spender)}</span>
          <span class="an-val">${valStr}</span>
        </div>`;
    }).join('');
    sections.push(`<div><div class="an-section-title">ERC-20 approvals</div>${rows}</div>`);
  }

  if (a.forgedTransfers?.length) {
    const rows = a.forgedTransfers.map(t => `
      <div class="an-row warn">
        <span class="an-label red">⚠ Forged transfer (log without state change)</span>
        <span class="an-addr">ERC-20 ${acc(t.token)}</span>
        <span class="an-addr">${acc(t.from)} → ${acc(t.to)}</span>
      </div>`).join('');
    sections.push(`<div>${rows}</div>`);
  }

  if (!sections.length) return '<div class="an-empty">No notable effects detected.</div>';
  return `<div class="analysis">${sections.join('')}</div>`;
}

async function submit(hash) {
  await fetch('/api/txs/' + hash + '/submit', { method: 'POST', headers: authHeaders() });
  load();
}

async function remove(hash) {
  await fetch('/api/txs/' + hash, { method: 'DELETE', headers: authHeaders() });
  load();
}
