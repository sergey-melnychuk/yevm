[package]
name = "yevm-reth"
version = "0.1.0"
edition = "2024"
description = "Chain impl reading Ethereum state directly from a local reth MDBX datadir, bypassing JSON-RPC for latest-block state (balance/nonce/code/storage), and a reth node that executes blocks with yevm."
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/sergey-melnychuk/yevm"
publish = false

[dependencies]
yevm-base.workspace = true
yevm-core.workspace = true
yevm-misc.workspace = true
eyre.workspace = true
async-trait.workspace = true
alloy-primitives = { version = "1.5", default-features = false }
# For the `verify`/`dump` bins' runtime, and to detect/reuse an already-
# running tokio handle when building reth's `Runtime` (see `minimal_runtime`).
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros"] }
alloy-consensus = { version = "2.3", default-features = false }
alloy-eips = { version = "2.3", default-features = false }

# Not published to crates.io in a consumable form -- reth's own examples
# consume these via a pinned git ref: the v2.11.0 tag (`b9abbcc`), the
# first release with the EVM API the `exec` module needs.
reth-ethereum = { git = "https://github.com/paradigmxyz/reth", rev = "b9abbcc1b982755baa9021e6874e2e58936ca65f", features = ["node", "cli", "exex"] }
reth-node-types = { git = "https://github.com/paradigmxyz/reth", rev = "b9abbcc1b982755baa9021e6874e2e58936ca65f" }
reth-db = { git = "https://github.com/paradigmxyz/reth", rev = "b9abbcc1b982755baa9021e6874e2e58936ca65f", default-features = false }
reth-stages-types = { git = "https://github.com/paradigmxyz/reth", rev = "b9abbcc1b982755baa9021e6874e2e58936ca65f", default-features = false }

# exec: yevm as reth's EVM (`exec` module, `node` bin).
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", rev = "b9abbcc1b982755baa9021e6874e2e58936ca65f", features = ["std"] }
reth-ethereum-forks = { git = "https://github.com/paradigmxyz/reth", rev = "b9abbcc1b982755baa9021e6874e2e58936ca65f", features = ["std"] }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", rev = "b9abbcc1b982755baa9021e6874e2e58936ca65f", features = ["std"] }
reth-evm = { git = "https://github.com/paradigmxyz/reth", rev = "b9abbcc1b982755baa9021e6874e2e58936ca65f", features = ["std"] }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", rev = "b9abbcc1b982755baa9021e6874e2e58936ca65f", features = ["std"] }
reth-execution-types = { git = "https://github.com/paradigmxyz/reth", rev = "b9abbcc1b982755baa9021e6874e2e58936ca65f", features = ["std"] }
reth-storage-errors = { git = "https://github.com/paradigmxyz/reth", rev = "b9abbcc1b982755baa9021e6874e2e58936ca65f", features = ["std"] }
# From crates.io in reth too; the workspace `[patch.crates-io]` redirects it to reth-core.
reth-primitives-traits = { version = "0.8.2", features = ["std"] }
# The evm2 rev that reth rev pins; the workspace `[patch]` keeps it one crate with reth's.
evm2 = { git = "https://github.com/alloy-rs/evm2", rev = "66687c18b34d3bdbb899f5eb7605070615c03475", features = ["block", "std"] }
alloy-eip7928 = { version = "0.4.10", features = ["std"] }
alloy-rpc-types-engine = { version = "2.5.0", default-features = false, features = ["std"] }
# silt (state-diff feed, binary lookups + proofs, silt_multiproof) installed into the `node`
# bin. It must build against this same reth rev: silt 9df61c2 (D12, D13, reth v2.11.0) pins reth v2.11.0 too.
silt-node = { git = "https://github.com/sergey-melnychuk/silt.git", rev = "9df61c213c065c6dce94a30245f83ea8c5861157" }
# silt PLAN M6 (the `sim-bench` example and the node's opt-in sim task): the silt-cache consumer with its
# yevm adapter and `sim` timing module, from the same silt rev as silt-node.
silt-cache = { git = "https://github.com/sergey-melnychuk/silt.git", rev = "9df61c213c065c6dce94a30245f83ea8c5861157", features = ["yevm"] }
silt-wire = { git = "https://github.com/sergey-melnychuk/silt.git", rev = "9df61c213c065c6dce94a30245f83ea8c5861157" }
serde_json.workspace = true
futures.workspace = true
libc = "0.2"
thiserror.workspace = true
tracing = "0.1"

[dev-dependencies]
criterion = { package = "codspeed-criterion-compat", version = "4.3" }
reth-evm = { git = "https://github.com/paradigmxyz/reth", rev = "b9abbcc1b982755baa9021e6874e2e58936ca65f", features = ["test-utils"] }
reth-testing-utils = { git = "https://github.com/paradigmxyz/reth", rev = "b9abbcc1b982755baa9021e6874e2e58936ca65f" }
secp256k1 = { version = "0.33", default-features = false, features = ["global-context", "recovery"] }
# EEST blockchain tests (`tests/eest.rs`): fixture parsing, block decoding, and an independent
# state root computation for the in-memory world state the cases run on.
alloy-rlp = "0.3"
alloy-trie = { version = "0.9", features = ["ethereum"] }
serde.workspace = true
serde_json.workspace = true

[[bench]]
name = "execute"
harness = false
